name: React DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    name: Build and Secure React App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./devsecops-app

    steps:
    # 1. Fetch code from GitHub
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './devsecops-app/package-lock.json'

    # 3. Code Cleanliness (Linting)
    - name: Install & Run Lint
      run: |
        npm ci
        npm run lint --if-present

    # 4. SCA Scan: Check third-party npm packages for vulnerabilities
    - name: Dependency Scan (SCA) with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './frontend'
        format: 'table'
        exit-code: '1' # Fails the pipeline if severe vulnerabilities exist
        severity: 'CRITICAL,HIGH'

    # 5. Secrets Scan: Prevent exposed passwords and API keys
    - name: Scan Repository for Secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    # 6. Build Docker Image Locally
    - name: Build Local Docker Imagea
      env:
        REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
      run: |
        docker build --build-arg REACT_APP_API_URL="$REACT_APP_API_URL" -t react-app:test .
      working-directory: ./

    # 7. Container Scan: Ensure base Nginx/Linux OS contains no active threats
    - name: Container Image Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'react-app:test'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
